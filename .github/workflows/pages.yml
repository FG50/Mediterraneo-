# Pubblica il sito di prenotazione su GitHub Pages.
#
# Non c'e' niente da compilare: `site/` e' gia' il sito. Il workflow lo
# prende e lo pubblica. Una volta sola, all'inizio, bisogna accendere
# Pages: Settings -> Pages -> Source: GitHub Actions.

name: Sito

on:
  push:
    branches: [main]
    paths: ["site/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Una pubblicazione alla volta; se ne arriva un'altra mentre questa e'
# in corso si aspetta, non si annulla: meglio tardi che a meta'.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  pubblica:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
